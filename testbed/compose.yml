# Изолированный стенд: сеть internal без выхода в интернет.
#   alice: Transmission → tun2socks → Xray-клиент → VLESS → нода → freedom → сид/трекер
#   bob:   обычные HTTP/UDP-запросы тем же путём (контроль ложных срабатываний)
#   xtg:   в сетевом пространстве ноды, читает её access-лог
x-tools: &tools
  build: .
  image: xtg-testbed-tools

services:
  tracker:
    <<: *tools
    command: python3 /opt/tb/tracker.py
    networks: {wan: {ipv4_address: 10.77.0.5}}

  seeder:
    <<: *tools
    command: /opt/tb/seeder.sh
    environment: {TRACKER_IP: 10.77.0.5, UP_KBPS: "${UP_KBPS:-100}", ENC: "${ENC:-1}", DHT: "${DHT:-1}", UTP: "${UTP:-1}"}
    volumes: [share:/share]
    networks: {wan: {ipv4_address: 10.77.0.10}}

  # остальной рой: те же данные, адреса динамические
  peers:
    <<: *tools
    command: /opt/tb/seeder.sh
    environment: {TRACKER_IP: 10.77.0.5, ROLE: peer, UP_KBPS: "${UP_KBPS:-100}", ENC: "${ENC:-1}", DHT: "${DHT:-1}", UTP: "${UTP:-1}"}
    volumes: [share:/share]
    networks: [wan]
    deploy: {replicas: "${PEERS:-12}"}

  web:
    <<: *tools
    command: /opt/tb/web.sh
    networks: {wan: {ipv4_address: 10.77.0.20}}

  node:
    <<: *tools
    command: /opt/tb/node.sh
    environment:
      UUID_ALICE: 11111111-1111-4111-8111-111111111111
      UUID_BOB: 22222222-2222-4222-8222-222222222222
      TRANSPORT: "${TRANSPORT:-tcp}"
    volumes: [xraylog:/run/xray]
    networks: {wan: {ipv4_address: 10.77.0.2}}

  xtg:
    build: {context: .., dockerfile: Dockerfile}
    image: xtg:test
    network_mode: service:node
    depends_on: [node]
    cap_add: [NET_RAW]
    volumes: [xraylog:/run/xray]
    command: [run, --iface, eth0, --xray-log, /run/xray/access.log, --xray-log-max, 1M,
              --only-attributed, --api, "0.0.0.0:9090", --cooldown, "20"]

  alice-vpn:
    <<: *tools
    command: /opt/tb/client.sh
    environment: {NODE_IP: 10.77.0.2, UUID: 11111111-1111-4111-8111-111111111111, TRANSPORT: "${TRANSPORT:-tcp}", BYPASS_IP: "${BYPASS_IP:-}"}
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    networks: {wan: {ipv4_address: 10.77.0.30}}

  alice:
    <<: *tools
    command: /opt/tb/leecher.sh
    network_mode: service:alice-vpn
    depends_on: [alice-vpn, seeder]
    environment: {ENC: "${ENC:-1}", DHT: "${DHT:-1}", UTP: "${UTP:-1}"}
    volumes: [share:/share:ro]

  bob-vpn:
    <<: *tools
    command: /opt/tb/client.sh
    environment: {NODE_IP: 10.77.0.2, UUID: 22222222-2222-4222-8222-222222222222, TRANSPORT: "${TRANSPORT:-tcp}"}
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    networks: {wan: {ipv4_address: 10.77.0.31}}

  bob:
    <<: *tools
    command: /opt/tb/browse.sh
    network_mode: service:bob-vpn
    depends_on: [bob-vpn, web]
    environment: {WEB_IP: 10.77.0.20}

networks:
  wan:
    internal: true
    ipam: {config: [{subnet: 10.77.0.0/24, ip_range: 10.77.0.128/25}]}

volumes:
  share:
  xraylog:
